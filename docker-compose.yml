version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: ../deployment/Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/ml_artifacts:/app/ml_artifacts
    environment:
      - DATABASE_URL=sqlite:///./water_quality.db
      - CORS_ORIGINS=http://localhost:3000

  frontend:
    build:
      context: ./frontend
      dockerfile: ../deployment/Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
